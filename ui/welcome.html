<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Corvid</title>
  <style>
    :root {
      --bg-top: #0d1f19;
      --bg-bottom: #08130f;
      --text: #eef4f1;
      --muted: #7d948a;
      --accent: #2ee06f;
    }
    :root[data-theme="light"] {
      --bg-top: #f3f8f5;
      --bg-bottom: #e7efeb;
      --text: #0c2118;
      --muted: #5d7568;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 27px;
      background: linear-gradient(140deg, #34e877 0%, #0f9e6c 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
      box-shadow: 0 14px 50px rgba(46, 224, 111, 0.35), inset 0 2px 0 rgba(255,255,255,0.35);
    }
    .logo svg { width: 52px; height: 52px; }
    .logo svg path { fill: #06231a; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); }
    h1 { font-size: 27px; font-weight: 650; letter-spacing: 0.2px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 460px; margin-bottom: 26px; }
    .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .add {
      background: var(--accent); color: #06231a; border: none; border-radius: 26px;
      padding: 13px 30px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: filter 0.15s, transform 0.12s; font-family: inherit;
      box-shadow: 0 6px 22px rgba(46,224,111,0.35);
      display: flex; align-items: center; gap: 10px;
    }
    .add:disabled { opacity: 0.5; cursor: wait; }
    .add:active { transform: scale(0.97); transition-duration: 0.05s; }
    .add svg { width: 18px; height: 18px; }
    .add svg path { fill: currentColor; }
    .add:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .add.fb {
      background: #1877f2; color: #ffffff;
      box-shadow: 0 6px 22px rgba(24,119,242,0.4);
    }
    .add.ig {
      background: #e1306c; color: #ffffff;
      box-shadow: 0 6px 22px rgba(225,48,108,0.4);
    }
    .add.xv {
      background: #16181c; color: #ffffff;
      box-shadow: 0 6px 22px rgba(22,24,28,0.45);
    }
    .add.tt {
      background: #010101; color: #ffffff;
      box-shadow: 0 6px 22px rgba(254,44,85,0.45);
    }
    .add.tw {
      background: #6441a5; color: #ffffff;
      box-shadow: 0 6px 22px rgba(145,70,255,0.45);
    }
    /* ?splash=1 boot-with-accounts variant: the brand beat only. The full
       picker (tagline + add buttons) belongs to the no-accounts state - a
       complete picker that flashes for a second at every startup and can
       never be reached again is confusion, not UI (user note 2026-10-31). */
    body.splash #msg, body.splash .choices { display: none; }
    body.splash .logo { width: 84px; height: 84px; }
  </style>
</head>

  <script>
    "use strict";
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    document.documentElement.dataset.theme = "dark";
    // ?splash=1: the shell booted WITH accounts - render the brand beat
    // (logo + name) only; an account webview replaces this view in a beat.
    if (new URLSearchParams(location.search).get("splash") === "1") {
      document.body.classList.add("splash");
    }
    api("/api/prefs").then((prefs) => {
      document.documentElement.dataset.theme = prefs.theme === "light" ? "light" : "dark";
    }).catch(() => {});

    // Native-app feel: no browser context menu on the shell UI.
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    async function addAccount(service, btn) {
      btn.disabled = true;
      try {
        await api("/api/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ service }),
        });
        fetch("/api/ui/rail/refresh", { method: "POST" }).catch(() => {});
        btn.disabled = false;
      } catch (e) { console.error(e); btn.disabled = false; }
    }
    document.getElementById("waBtn").onclick = (ev) => addAccount("whatsapp", ev.currentTarget);
    document.getElementById("fbBtn").onclick = (ev) => addAccount("facebook", ev.currentTarget);
    document.getElementById("igBtn").onclick = (ev) => addAccount("instagram", ev.currentTarget);
    document.getElementById("xBtn").onclick = (ev) => addAccount("x", ev.currentTarget);
    document.getElementById("ttBtn").onclick = (ev) => addAccount("tiktok", ev.currentTarget);
    document.getElementById("twBtn").onclick = (ev) => addAccount("twitch", ev.currentTarget);
  </script>

</html>
